name: Apply verified audit patch on authorized branch

on:
  push:
    branches: [fix/audit-hardening-20260917]
    paths: ['.github/workflows/audit-bootstrap.yml']

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'idnotbe/skill-quality-builder' && github.ref == 'refs/heads/fix/audit-hardening-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify base and exact patch bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor da247b21d9775f4fb4ccc8568bdd19b33bdda93d HEAD
          test "$(git rev-parse origin/main)" = da247b21d9775f4fb4ccc8568bdd19b33bdda93d
          python -B - <<'PY'
          from pathlib import Path
          import hashlib, lzma, os
          compressed = b''.join(Path(f'.audit-patch.part{i}').read_bytes() for i in range(4))
          assert len(compressed) == 28432
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'da158ec19aaa110f68303b63a6542e420b95a2dc727280b261f68cefd2254e66'
          assert len(patch) == 190887
          (Path(os.environ['RUNNER_TEMP']) / 'audit-fixes.patch').write_bytes(patch)
          print('Exact previously delivered audit patch verified.')
          PY
          git apply --check --exclude=.github/workflows/ci.yml "$RUNNER_TEMP/audit-fixes.patch"
          git apply --exclude=.github/workflows/ci.yml "$RUNNER_TEMP/audit-fixes.patch"
          git diff --check
      - name: Run all helper and regression tests on complete checkout
        run: python -B -m unittest discover -s tests -v
      - name: Lint the complete installed bundle
        run: python -B .agents/skills/skill-quality-builder/scripts/lint_skill.py .agents/skills/skill-quality-builder --format json
      - name: Verify fixed fixtures and explicit unverified host results
        shell: bash
        run: |
          python -B - <<'PY'
          from pathlib import Path
          import sys
          root = Path('.agents/skills/skill-quality-builder')
          sys.path.insert(0, str(root / 'scripts'))
          from summarize_evals import load_json, summarize, validate_suite, verify_fixture_files
          pairs = [('trigger-suite.json', 'observations.empty.json'), ('behavior-cases.json', 'behavior-observations.empty.json'), ('child-skill-cases.json', 'child-observations.empty.json')]
          for spec, records in pairs:
              suite = load_json(root / 'evals' / spec)
              validate_suite(suite)
              verify_fixture_files(suite, root / 'evals')
              report = summarize(suite, load_json(root / 'evals' / records))
              assert all(c['status'] == 'unverified' and c['assertions_evaluated'] == 0 for c in report['conditions'].values())
              print(spec, {k: (v['status'], v['assertions_evaluated'], v['assertions_expected']) for k, v in report['conditions'].items()})
          PY
      - name: Check full-bundle packaging
        shell: bash
        run: python -B .agents/skills/skill-quality-builder/scripts/package_skill.py .agents/skills/skill-quality-builder --output "$RUNNER_TEMP/skill-quality-builder.zip"
      - name: Commit only verified remediation files and push without force
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agents README.md tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply audited skill quality hardening'
          git push origin HEAD:refs/heads/fix/audit-hardening-20260917
          echo "Verified remediation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
