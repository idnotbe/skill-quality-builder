name: Import verified evaluation continuation
on:
  push:
    branches: ['eval/independent-cpu-20260918']
    paths: ['.github/workflows/import-resume-evaluation.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply and verify exact reviewed tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = d81f80815e59ee4c126d8f9319faa95e0d22f4ac
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          encoded=pathlib.Path('evaluation/.resume.patch.b64').read_text().replace('ob2qRCob2q0','ob2q0')
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='f8eb9a334dbb6106d9c1fcfbfc2080d5537432d9589f60ddbb49af5a7565ab2c'
          pathlib.Path('/tmp/resume.patch').write_bytes(patch)
          PY
          git apply --index /tmp/resume.patch
          git rm evaluation/.resume.patch.b64 .github/workflows/import-resume-evaluation.yml
          git diff --cached --check
          test "$(git write-tree)" = aaac7d40a14bef907d0c8a9f4e1a37ea86055a0d
          python -B -m unittest discover -s tests -p test_cpu_evaluation.py -v
          python -B -m unittest discover -s tests -p test_balanced_evaluation.py -v
          git config user.name idnotbe
          git config user.email 44212813+idnotbe@users.noreply.github.com
          git commit -m 'eval: retain interrupted evidence and execute frozen children in isolated contexts'
          git push origin HEAD:eval/independent-cpu-20260918
          git rev-parse HEAD
          git status --porcelain
      - name: Preserve import evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/import-evidence"
          git archive --format=tar.gz --output="$RUNNER_TEMP/import-evidence/source.tar.gz" HEAD
          git status --porcelain > "$RUNNER_TEMP/import-evidence/status.txt"
          git log -3 --oneline > "$RUNNER_TEMP/import-evidence/commits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resumed-import-evidence
          path: ${{ runner.temp }}/import-evidence/
          retention-days: 14
