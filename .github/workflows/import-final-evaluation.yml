name: Verify and import final evaluation evidence
on:
  push:
    branches: ['eval/independent-cpu-20260918']
    paths: ['.github/workflows/import-final-evaluation.yml']
permissions:
  contents: write
jobs:
  verify-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply exact reviewed report tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final-evidence"
          cp evaluation/.final-report.patch.b64 "$RUNNER_TEMP/final-evidence/transfer.txt"
          test "$(git rev-parse HEAD~2)" = 0d25ba2efe85b216399af6243aa15f556e0cf16b
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          encoded=pathlib.Path('evaluation/.final-report.patch.b64').read_text()
          encoded=encoded.replace('BG7NO9rbOtSxKL','BG7NO9rbOtltSxKL').replace('aZZZT1H1YM','aZZFTxH1YM')
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='1eb6ad7e4e8b8d480e27e86aaaf0dd6e97153bfc0f120730198cb6d46d114cca'
          pathlib.Path('/tmp/final.patch').write_bytes(patch)
          PY
          git apply --index /tmp/final.patch
          git rm evaluation/.final-report.patch.b64 .github/workflows/import-final-evaluation.yml .github/workflows/stop-obsolete-cpu-run.yml
          git diff --cached --check
          test "$(git write-tree)" = e356effb2d60d12c12a7102e5977ff5972556bef
      - name: Final full verification
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -v > "$RUNNER_TEMP/final-evidence/tests.txt" 2>&1
          python -B evaluation/build_catalog.py --check > "$RUNNER_TEMP/final-evidence/catalog.txt"
          python -B evaluation/harness.py check > "$RUNNER_TEMP/final-evidence/harness.txt"
          python -B .agents/skills/skill-quality-builder/scripts/lint_skill.py .agents/skills/skill-quality-builder --format json > "$RUNNER_TEMP/final-evidence/lint.json"
          python -B .agents/skills/skill-quality-builder/scripts/summarize_evals.py .agents/skills/skill-quality-builder/evals/child-skill-cases.json .agents/skills/skill-quality-builder/evals/child-observations.empty.json > "$RUNNER_TEMP/final-evidence/native-unverified.json"
      - name: Publish verified objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          def post(route,body):
              request=urllib.request.Request('https://api.github.com/repos/idnotbe/skill-quality-builder/git/'+route,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          expected='e356effb2d60d12c12a7102e5977ff5972556bef'
          assert git('write-tree')==expected
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          entries=[]
          for name in filter(None,paths):
              path=pathlib.Path(name)
              if path.is_file():
                  blob=post('blobs',{'content':path.read_text(),'encoding':'utf-8'})
                  assert blob['sha']==git('rev-parse',':'+name)
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
              else:entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
          tree=post('trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          assert tree['sha']==expected
          commit=post('commits',{'message':'eval: record actual isolated model results without claiming unsupported uplift','tree':expected,'parents':[git('rev-parse','HEAD')]})
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'final-evidence'
          (target/'published-commit.json').write_text(json.dumps({'commit':commit['sha'],'tree':expected,'parent':git('rev-parse','HEAD')},indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(target/'verified-source.tar.gz'),expected],check=True)
          print('Verified commit object:',commit['sha'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-evaluation-import
          path: ${{ runner.temp }}/final-evidence/
          retention-days: 14
