name: Opt-in independent CPU model evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-model-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute actual model trials
        run: python -B evaluation/cpu_evaluation.py "$RUNNER_TEMP/sqb-independent"
      - name: Final deterministic verification (not a model score)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sqb-independent"
          python -B evaluation/build_catalog.py --check > "$RUNNER_TEMP/sqb-independent/catalog-check.txt" 2>&1
          python -B evaluation/harness.py check > "$RUNNER_TEMP/sqb-independent/harness-check.txt" 2>&1
          python -B -m unittest discover -s tests -v > "$RUNNER_TEMP/sqb-independent/final-tests.txt" 2>&1
          python -B .agents/skills/skill-quality-builder/scripts/lint_skill.py .agents/skills/skill-quality-builder --format json > "$RUNNER_TEMP/sqb-independent/final-lint.json"
      - name: Retain exact source for independent evidence review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/sqb-independent"
          git archive --format=tar.gz --output="$RUNNER_TEMP/sqb-independent/source.tar.gz" HEAD
          git status --porcelain > "$RUNNER_TEMP/sqb-independent/repository-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-cpu-evidence
          path: ${{ runner.temp }}/sqb-independent/
          include-hidden-files: true
          retention-days: 14
