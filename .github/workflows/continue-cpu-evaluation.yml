name: Targeted independent CPU evaluation continuation
on:
  push:
    branches: ['eval/independent-cpu-20260918']
    paths: ['evaluation/continue_cpu_evaluation.py', '.github/workflows/continue-cpu-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-group:
    strategy:
      fail-fast: false
      matrix:
        group: [trigger, builder, child_csv, child_codebook]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: independent-cpu-evidence
          run-id: 35295024332
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/initial
      - name: Execute only this independent group
        run: python -B evaluation/continue_cpu_evaluation.py '${{ matrix.group }}' "$RUNNER_TEMP/initial" "$RUNNER_TEMP/continued"
      - name: Retain execution source and integrity checks
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/continued"
          git archive --format=tar.gz --output="$RUNNER_TEMP/continued/source.tar.gz" HEAD
          git status --porcelain > "$RUNNER_TEMP/continued/repository-status.txt"
          python -B evaluation/build_catalog.py --check > "$RUNNER_TEMP/continued/catalog-check.txt"
          python -B evaluation/harness.py check > "$RUNNER_TEMP/continued/harness-check.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: continued-${{ matrix.group }}
          path: ${{ runner.temp }}/continued/
          include-hidden-files: true
          retention-days: 14
