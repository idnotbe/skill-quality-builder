name: Temporary workspace preparation
on:
  push:
    branches: [feat/model-aware-quality-20260917]
    paths: [.github/workflows/workspace-bootstrap.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify merged heads before deleting only those branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          repo = 'idnotbe/skill-quality-builder'
          expected = [(1, 'feat/skill-quality-builder', 'd8344b0261daa56b7b758b443d820a340ab60e41'), (2, 'docs/easy-install', 'ca32c1928137b823b296a372488c95a642f6ee58'), (3, 'fix/audit-hardening-20260917', '778fc9c455bbd068dcc6785e9cdc7fe5e0be4365')]
          for number, branch, sha in expected:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{number}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  pr = json.load(response)
              assert pr['merged'] and pr['head']['sha'] == sha and pr['head']['ref'] == branch
              actual = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], text=True).strip()
              if not actual:
                  print('Already absent:', branch)
                  continue
              assert actual.split()[0] == sha, 'Branch changed; preserve it.'
              subprocess.run(['git', 'push', '--force-with-lease=refs/heads/' + branch + ':' + sha, 'origin', ':refs/heads/' + branch], check=True)
              print('Removed merged branch:', branch)
          PY
      - name: Export immutable main history without credentials or working files
        run: |
          test "$(git rev-parse origin/main)" = 70d777e83a3ea3b1e57d865922629d500acad2ad
          test -z "$(git status --porcelain)"
          git bundle create "$RUNNER_TEMP/source.bundle" refs/remotes/origin/main
          git bundle verify "$RUNNER_TEMP/source.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source
          path: ${{ runner.temp }}/source.bundle
          retention-days: 1
          if-no-files-found: error
