name: Static helper verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-17
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-17
        with:
          python-version: ${{ matrix.python }}
      - name: Helper tests, initialization, and package/extract regressions
        run: python -B -m unittest discover -s tests -v
      - name: Balanced catalog regeneration and fixture integrity
        run: |
          python -B evaluation/build_catalog.py --check
          python -B evaluation/harness.py check
      - name: Full installed-bundle structural lint
        run: python -B .agents/skills/skill-quality-builder/scripts/lint_skill.py .agents/skills/skill-quality-builder --format json
      - name: Confirm host evaluation is still explicitly unverified
        run: python -B .agents/skills/skill-quality-builder/scripts/summarize_evals.py .agents/skills/skill-quality-builder/evals/child-skill-cases.json .agents/skills/skill-quality-builder/evals/child-observations.empty.json
