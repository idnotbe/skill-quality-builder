name: Temporary verified quality upgrade
on:
  push:
    branches: [feat/model-aware-quality-20260917]
    paths: [.github/workflows/upgrade-apply.yml]
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify base and exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 70d777e83a3ea3b1e57d865922629d500acad2ad
          test -z "$(git status --porcelain)"
          python -B - <<'PY'
          from pathlib import Path
          import hashlib, lzma, os
          compressed = b''.join(Path(f'.quality-patch.part{i}').read_bytes() for i in range(6))
          assert len(compressed) == 30504
          patch = lzma.decompress(compressed)
          assert len(patch) == 122722
          assert hashlib.sha256(patch).hexdigest() == '898b0995fd1ebe1ee5b0198c24c50f7ec5a8b58cb5a4873c831edfa5028c4988'
          (Path(os.environ['RUNNER_TEMP']) / 'quality-upgrade.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/quality-upgrade.patch"
          git apply "$RUNNER_TEMP/quality-upgrade.patch"
          git diff --check
      - name: Verify helpers and regression cases on complete checkout
        run: python -B -m unittest discover -s tests -v
      - name: Lint complete skill bundle
        run: python -B .agents/skills/skill-quality-builder/scripts/lint_skill.py .agents/skills/skill-quality-builder --format json
      - name: Package complete skill outside source
        shell: bash
        run: python -B .agents/skills/skill-quality-builder/scripts/package_skill.py .agents/skills/skill-quality-builder --output "$RUNNER_TEMP/skill-quality-builder.zip"
      - name: Commit verified changes and push without force
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agents README.md tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add model-aware skill improvement and controlled evaluation tools'
          git push origin HEAD:refs/heads/feat/model-aware-quality-20260917
          echo "Verified upgrade commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
